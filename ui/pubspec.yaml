name: orbit
description: "AI-Powered Alumni Networking Platform"
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  cupertino_icons: ^1.0.2
  desktop_window: ^0.4.0
  socket_io_client: ^2.0.3
  url_launcher: ^6.3.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true

  assets:
    - assets/


# This section should be at the very bottom of the file, with no indentation
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png" #<-- PATH TO YOUR LOGO